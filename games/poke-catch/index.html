:root{--ink:#213b34;--paper:#f6f4ee;--orange:#ae492d;--line:#d8ddd3}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}button,a{font:inherit}button{cursor:pointer;min-height:44px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink);padding:10px 16px}button:focus-visible,a:focus-visible{outline:3px solid var(--orange);outline-offset:3px}button:disabled{opacity:.5;cursor:default}.shell{max-width:900px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--orange)}h1{font-size:clamp(23px,4vw,34px);margin:7px 0 8px;line-height:1.2}.languages{display:flex;gap:8px}.languages button{padding:8px 10px;font-size:12px}.languages [aria-pressed=true]{background:var(--ink);color:white}.intro{font-size:14px;color:#64716a;line-height:1.7;margin:12px 0 18px}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.stat{background:#e7eadf;padding:10px 12px;border-radius:8px}.stat span{display:block;font-size:11px}.stat strong{font-size:24px;font-variant-numeric:tabular-nums}.field{position:relative;overflow:hidden;border:1px solid #bfc9b7;border-radius:18px;height:clamp(310px,48vh,460px);background:radial-gradient(circle at 75% 20%,#fff6cf80 0 11%,transparent 11.3%),linear-gradient(160deg,#dbe8d4,#bfcfba);isolation:isolate}.field::before{content:'';position:absolute;inset:0;background:radial-gradient(#213b3414 1px,transparent 1px);background-size:18px 18px;pointer-events:none}.target{position:absolute;width:70px;height:78px;padding:0;border:0;background:none;min-height:0;will-change:transform;touch-action:manipulation}.target svg{width:64px;height:64px;filter:drop-shadow(0 4px 2px #213b3428)}.target:active{filter:brightness(1.2)}.overlay{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:24px;background:#f6f4eede;backdrop-filter:blur </style></head><body><main class="shell"><header><div><div class="eyebrow">RAY’S MINI ARCADE · 01</div><h1 data-i18n="title">小怪獸捕捉挑戰</h1></div><div class="languages" aria-label="Language"><button data-lang="zh" aria-pressed="true">中文</button><button data-lang="en" aria-pressed="false">EN</button></div></header><p class="intro" data-i18n="intro">60 秒捕捉挑戰。瞄準投球，命中小怪獸並累積連擊，挑戰你的最高紀錄。</p><div class="hud"><div class="stat"><span data-i18n="score">分數</span><strong id="score">0</strong></div><div class="stat"><span data-i18n="time">剩餘秒數</span><strong id="time">60</strong></div><div class="stat"><span data-i18n="combo">連擊</span><strong id="combo">0</strong></div><div class="stat"><span data-i18n="best">最高紀錄</span><strong id="best">0</strong></div></div><div class="field" id="field" aria-label="捕捉區"><div class="overlay" id="overlay"><div class="panel"><h2 id="heading">準備好探索了嗎？</h2><p id="message">點擊／觸控瞄準投球，落點命中才得分。投空或漏掉會中斷連擊；每 20 秒會加快節奏。</p><button id="start" class="primary">開始挑戰</button></div></div></div><div class="meter" aria-hidden="true"><div id="meter"></div></div><div class="toolbar"><p class="hint" data-i18n="hint">點擊／觸控瞄準投球 · 投空會中斷連擊<br>空白鍵：暫停／繼續</p><button id="pause" disabled>暫停</button></div><p class="notice" id="notice" role="status" aria-live="polite"></p><div class="foot" data-i18n="foot">Ray Kwok 製作的非官方粉絲小遊戲。無需登入，紀錄只儲存在此瀏覽器。寶可夢角色屬原權利人所有。</div></main><script>
(()=>{'use strict';

const shapes=[

['百變怪','Ditto','<path d="M7 49Q2 32 15 32Q18 17 29 25Q39 17 44 29Q60 23 57 42Q64 60 38 57Q10 63 7 49Z" fill="#b994bf"/><circle cx="24" cy="37" r="2"/><circle cx="41" cy="37" r="2"/><path d="M24 46q9 5 17-1" fill="none"/>'],
['鬼斯','Gastly','<path d="m32 2 6 8 12-3 1 13 12 8-9 10 8 13-16 1-11 10-8-8-17 3 3-15-11-9 10-8-2-12 14-1Z" fill="#b596c0" stroke="none"/><circle cx="32" cy="32" r="21" fill="#524968"/><path d="m15 24 13 7-11 6Zm34 0-13 7 11 6Z" fill="white"/><path d="M22 43q10 9 20-1" fill="none" stroke="white"/>'],
['胖丁','Jigglypuff','<path d="m13 24-2-19 17 10M38 15 53 5l-2 21" fill="#e4b9c5"/><circle cx="32" cy="35" r="25" fill="#e4b9c5"/><path d="M26 14q13-10 15 2t-12 5" fill="#e4b9c5"/><ellipse cx="22" cy="34" rx="6" ry="9" fill="#e5f4ef"/><ellipse cx="43" cy="34" rx="6" ry="9" fill="#e5f4ef"/><ellipse cx="23" cy="35" rx="3" ry="6" fill="#3c7276"/><ellipse cx="42" cy="35" rx="3" ry="6" fill="#3c7276"/><path d="M28 47q5 4 9 0" fill="none"/>']
];
let lang=new URLSearchParams(location.search).get('lang')==='en'?'en':'zh',state='ready',score=0,combo=0,maxCombo=0,caught=0,elapsed=0,last=0,nextSpawn=0,raf=0,best=0;let targets=[],shot=null;const reduced=matchMedia('(prefers-reduced-motion: reduce)');try{const n=Number(localStorage.getItem('ray-poke-catch-throw-best'));if(Number.isFinite(n)&&n>=0)best=n;}catch{}
const svg=body=>`<svg viewBox="0 0 64 64" aria-hidden="true" fill="#213b34" stroke="#213b34" stroke-width="1.5" stroke-linejoin="round">${body}</svg>`;
function paint(){ $('score').textContent=score;$('combo').textContent=combo;$('time').textContent=Math.ceil(Math.max(0,60-elapsed));$('best').textContent=best;$('meter').style.transform=`scaleX(${Math.max(0,1-elapsed/60)})`;}
function panel(){targets.forEach(t=>t.el.disabled=state!=='playing');const c=copy[lang];$('overlay').hidden=state==='playing';$('pause').disabled=state==='ready'||state==='ended';$('pause').textContent=state==='paused'?c.resume:c.pause;const key=state==='ended'?'end':state==='paused'?'paused':'ready';$('heading').textContent=c[key];$('message').textContent=state==='ended'?c.result(score,maxCombo,caught):state==='paused'?c.pauseCopy:c.rules;$('start').textContent=state==='ended'?c.again:state==='paused'?c.resume:c.start;}
function language(next){lang=next;const c=copy[lang];document.documentElement.lang=lang==='zh'?'zh-Hant':'en';document.title=c.title+' · Ray Kwok';document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=c[e.dataset.i18n]);document.querySelectorAll('[data-lang]').forEach(e=>e.setAttribute('aria-pressed',e.dataset.lang===lang));$('field').setAttribute('aria-label',c.field);targets.forEach(t=>t.el.setAttribute('aria-label',`${c.catch} ${shapes[t.kind][lang==='zh'?0:1]}`));$('notice').textContent='';panel();}
const ballSVG=svg('<path d="M3 16a13 13 0 0 1 26 0Z" fill="#ae492d"/><path d="M3 16a13 13 0 0 0 26 0Z" fill="#f6f4ee"/><path d="M3 16H29"/><circle cx="16" cy="16" r="4" fill="#f6f4ee"/>').replace('viewBox="0 0 64 64"','viewBox="0 0 32 32"');
const launcher=document.createElement('div');launcher.className='launcher';launcher.setAttribute('aria-hidden','true');launcher.innerHTML=ballSVG;$('field').append(launcher);
function clearShot(){if(shot){shot.el.remove();shot.ring?.remove();shot=null;}}
function findHit(items,x,y){return items.find(t=>!t.catching&&Math.hypot(t.x+35-x,t.y+32-y)<=34);}
function throwBall(event){
 if(state!=='playing'||shot)return;
 const box=$('field').getBoundingClientRect();let x=event.clientX-box.left,y=event.clientY-box.top;
 if(event.detail===0){const target=event.target.closest('.target');if(!target)return;const r=target.getBoundingClientRect();x=r.left-box.left+35;y=r.top-box.top+32;}
 const el=document.createElement('div');el.className='ball';el.setAttribute('aria-hidden','true');el.innerHTML=ballSVG;$('field').append(el);
 shot={el,x,y,fromX:box.width/2,fromY:box.height-30,born:elapsed,phase:'flight'};
 $('notice').textContent='';
}
function updateShot(){
 if(!shot)return;const age=elapsed-shot.born;
 if(shot.phase==='flight'){
  const u=Math.min(1,age/(reduced.matches?.12:.42)),x=shot.fromX+(shot.x-shot.fromX)*u,y=shot.fromY+(shot.y-shot.fromY)*u-(reduced.matches?0:Math.sin(u*Math.PI)*65);
  shot.el.style.transform=`translate(${x-16}px,${y-16}px) rotate(${reduced.matches?0:u*540}deg)`;
  if(u<1)return;
  const t=findHit(targets,shot.x,shot.y);
  if(!t){combo=0;$('notice').textContent=copy[lang].miss;clearShot();return;}
  catchTarget(t);shot.phase='capture';shot.born=elapsed;shot.target=t;
  const ring=document.createElement('div');ring.className='impact';ring.style.left=shot.x-33+'px';ring.style.top=shot.y-33+'px';$('field').append(ring);shot.ring=ring;
 }else{
  const u=Math.min(1,age/(reduced.matches?.18:.75)),shake=reduced.matches?0:Math.sin(u*Math.PI*6)*(1-u)*14;
  shot.el.style.transform=`translate(${shot.x-16}px,${shot.y-16}px) rotate(${shake}deg)`;
  shot.ring.style.opacity=String((1-u)*.7);shot.ring.style.transform=`scale(${.5+u})`;
  if(u===1){remove(shot.target);clearShot();}
 }
}
$('field').addEventListener('click',event=>{if(!event.target.closest('.overlay'))throwBall(event);});
function remove(t){t.el.remove();targets=targets.filter(x=>x!==t);}
function catchTarget(t){if(state!=='playing'||!targets.includes(t)||t.catching)return;t.catching=true;t.el.disabled=true;t.el.classList.add('catching');combo++;maxCombo=Math.max(maxCombo,combo);caught++;const points=10+Math.min(combo-1,5)*2;score+=points;const rect=t.el.getBoundingClientRect(),field=$('field').getBoundingClientRect();const p=document.createElement('span');p.className='spark';p.textContent='+'+points;p.style.left=rect.left-field.left+'px';p.style.top=rect.top-field.top+'px';$('field').append(p);setTimeout(()=>p.remove(),600);$('notice').textContent='';paint();}
function spawn(){if(targets.length>=6)return;const kind=Math.floor(Math.random()*shapes.length),el=document.createElement('button');el.className='target';el.type='button';el.innerHTML=svg(shapes[kind][2]);el.setAttribute('aria-label',`${copy[lang].catch} ${shapes[kind][lang==='zh'?0:1]}`);const box=$('field').getBoundingClientRect();let x=0,y=0;for(let n=0;n<20;n++){x=Math.random()*Math.max(1,box.width-72);y=Math.random()*Math.max(1,box.height-140);if(targets.every(t=>Math.hypot(t.x-x,t.y-y)>85))break;}const speed=elapsed<20?12:elapsed<40?22:30;const t={el,kind,x,y,vx:(Math.random()>.5?1:-1)*speed,vy:(Math.random()>.5?1:-1)*speed*.65,expires:elapsed+(elapsed<20?4:elapsed<40?3.5:3)};el.style.transform=`translate(${x}px,${y}px)`;targets.push(t);$('field').append(el);}
function end(){clearShot();state='ended';$('notice').textContent='';targets.forEach(t=>t.el.remove());targets=[];if(score>best){best=score;try{localStorage.setItem('ray-poke-catch-throw-best',String(best));}catch{}}paint();panel();$('start').focus();}
function tick(now){if(state!=='playing')return;const dt=Math.max(0,(now-last)/1000);last=now;elapsed+=dt;if(elapsed>=60){elapsed=60;end();return;}const box=$('field').getBoundingClientRect();for(const t of [...targets]){if(t.catching)continue;if(elapsed>=t.expires){remove(t);combo=0;$('notice').textContent=copy[lang].miss;continue;}if(!reduced.matches){t.x+=t.vx*dt;t.y+=t.vy*dt;const mx=Math.max(0,box.width-72),my=Math.max(0,box.height-140);if(t.x<0||t.x>mx){t.vx*=-1;t.x=Math.max(0,Math.min(mx,t.x));}if(t.y<0||t.y>my){t.vy*=-1;t.y=Math.max(0,Math.min(my,t.y));}t.el.style.transform=`translate(${t.x}px,${t.y}px)`;}}updateShot();if(elapsed>=nextSpawn){spawn();nextSpawn=elapsed+(elapsed<20?.85:elapsed<40?.65:.48);}paint();raf=requestAnimationFrame(tick);}
function start(){if(state==='paused'){state='playing';last=performance.now();panel();raf=requestAnimationFrame(tick);return;}cancelAnimationFrame(raf);clearShot();targets.forEach(t=>t.el.remove());targets=[];score=combo=maxCombo=caught=elapsed=nextSpawn=0;state='playing';$('notice').textContent='';paint();panel();last=performance.now();spawn();nextSpawn=.85;raf=requestAnimationFrame(tick);$('pause').focus();}
function pause(){if(state==='playing'){state='paused';cancelAnimationFrame(raf);panel();}else if(state==='paused')start();}
$('start').addEventListener('click',start);$('pause').addEventListener('click',pause);document.querySelectorAll('[data-lang]').forEach(e=>e.addEventListener('click',()=>language(e.dataset.lang)));document.addEventListener('keydown',e=>{if(e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;if(e.code==='Space'&&(state==='playing'||state==='paused')){e.preventDefault();pause();}if(e.key==='Escape'&&state==='playing')pause();});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pause();});window.addEventListener('blur',()=>{if(state==='playing')pause();});window.addEventListener('message',e=>{if(e.source===parent&&e.origin===location.origin&&e.data?.type==='ray-game-language'&&['zh','en'].includes(e.data.language))language(e.data.language);});language(lang);paint();
})();
